[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Mezo documents `london` as its EVM target; it also avoids PUSH0.
evm_version = "london"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
# 64 runs x 200 calls keeps CI fast; the release check used 256 x 500 (128,000 calls per suite).
runs = 64
depth = 200
